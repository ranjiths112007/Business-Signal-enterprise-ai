services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: business-signal-postgres
    environment:
      POSTGRES_DB: business_signal
      POSTGRES_USER: business_signal
      POSTGRES_PASSWORD: business_signal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_signal -d business_signal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://business_signal:business_signal@postgres:5432/business_signal
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.6-flash}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
