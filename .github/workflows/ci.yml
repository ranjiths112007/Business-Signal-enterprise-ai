name: Business Signal CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: docker compose up -d postgres
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker exec business-signal-postgres pg_isready -U business_signal -d business_signal; then
              exit 0
            fi
            sleep 2
          done
          docker logs business-signal-postgres
          exit 1
      - run: python -m compileall backend/app
      - run: python backend/seed.py
      - run: PYTHONPATH=backend pytest backend/tests -q
      - run: PYTHONPATH=backend python evaluation/run.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
