name: Business Signal CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: docker compose up -d postgres
      - run: python -m compileall backend/app
      - run: python backend/seed.py
      - run: PYTHONPATH=backend pytest backend/tests -q
      - run: PYTHONPATH=backend python evaluation/run.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f frontend/index.html
